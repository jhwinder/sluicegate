[project]
name = "sg-service"
version = "0.1.0"
description = "SluiceGate service and Minion Mission Control"
requires-python = ">=3.11"
dependencies = [
  "sg-core",
  "fastapi>=0.115.0",
  "cryptography>=42.0.0",
  "uvicorn[standard]>=0.30.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx2>=1.0.0", "httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sg_service"]
