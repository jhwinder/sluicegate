version: 1

default:
  decision: BLOCK

rules:
  # Patching targets and execution settings are policy-owned.
  - name: pause-patch-test-host-for-approval
    when:
      - path: action.name
        eq: windows.patch.reconcile
      - path: target.servers
        eq: [patch-reboot-test.example.gov]
      - path: context.approval.approved
        exists: false
    obligations:
      - type: allowed_patch_targets
        servers: [patch-reboot-test.example.gov]
      - type: patch_constraints
        patch_sources: [wsus, nessus_catalog]
        allowed_patch_types: [SECURITY]
        allow_reboot: true
        maintenance_window:
          start_utc: "2026-10-16T00:00:00Z"
          end_utc: "2026-10-16T04:00:00Z"
        outside_window_decision: PAUSE
      - type: allowed_patch_executables
        executables: [msiexec.exe]
    decision: PAUSE
  - name: allow-demo-security-patching-without-reboot
    when:
      - path: action.name
        eq: windows.patch.reconcile
      - path: target.servers
        eq: [patch-test.example.gov]
    obligations:
      - type: allowed_patch_targets
        servers: [patch-test.example.gov]
      - type: patch_constraints
        patch_sources: [wsus, nessus_catalog]
        allowed_patch_types: [SECURITY]
        allow_reboot: false
        maintenance_window: null
      - type: allowed_patch_executables
        executables: [msiexec.exe]
    decision: ALLOW
  - name: allow-demo-patch-test-host-after-approval
    when:
      - path: action.name
        eq: windows.patch.reconcile
      - path: target.servers
        eq: [patch-reboot-test.example.gov]
      - path: context.approval.approved
        eq: true
    obligations:
      - type: allowed_patch_targets
        servers: [patch-reboot-test.example.gov]
      - type: patch_constraints
        patch_sources: [wsus, nessus_catalog]
        allowed_patch_types: [SECURITY]
        allow_reboot: true
        maintenance_window:
          start_utc: "2026-10-16T00:00:00Z"
          end_utc: "2026-10-16T04:00:00Z"
        outside_window_decision: PAUSE
      - type: allowed_patch_executables
        executables: [msiexec.exe]
    decision: ALLOW

  # Stripe demo rules
  - name: allow_small_refund
    when:
      - path: action.name
        in: [stripe.refund, stripe.charge]
      - path: action.params.amount
        lte: 100
      - path: action.params.currency
        eq: USD
    decision: ALLOW

  - name: allow_approved_refund
    when:
      - path: action.name
        in: [stripe.refund, stripe.charge]
      - path: action.params.amount
        lte: 500
      - path: action.params.currency
        eq: USD
      - path: context.approval.approved
        eq: true
    decision: ALLOW

  - name: pause_mid_refund
    when:
      - path: action.name
        in: [stripe.refund, stripe.charge]
      - path: action.params.amount
        lte: 500
      - path: action.params.currency
        eq: USD
    decision: PAUSE

  - name: block_large_refund
    when:
      - path: action.name
        in: [stripe.refund, stripe.charge]
      - path: action.params.amount
        gt: 500
      - path: action.params.currency
        eq: USD
    decision: BLOCK
