version: 1
default:
  decision: PAUSE
rules:
- name: allow_small_refund
  when:
  - path: action.name
    eq: stripe.refund
  - path: context.amount
    lte: 100
  - path: context.currency
    eq: USD
  decision: ALLOW
- name: pause_mid_refund
  when:
  - path: action.name
    eq: stripe.refund
  - path: context.amount
    lte: 500
  - path: context.currency
    eq: USD
  decision: PAUSE
- name: block_large_refund
  when:
  - path: action.name
    eq: stripe.refund
  - path: context.amount
    gt: 500
  - path: context.currency
    eq: USD
  decision: BLOCK
