version: 1

default:
  decision: PAUSE

rules:
  - id: allow_small_charge
    when:
      - path: action.name
        operator: eq
        expected: stripe.charge
      - path: context.amount
        operator: lte
        expected: 100
      - path: context.currency
        operator: ieq
        expected: USD
    decision: ALLOW

  - id: pause_mid_charge
    when:
      - path: action.name
        operator: eq
        expected: stripe.charge
      - path: context.amount
        operator: lte
        expected: 500
      - path: context.currency
        operator: ieq
        expected: USD
    decision: PAUSE

  - id: block_large_charge
    when:
      - path: action.name
        operator: eq
        expected: stripe.charge
      - path: context.amount
        operator: gt
        expected: 500
      - path: context.currency
        operator: ieq
        expected: USD
    decision: BLOCK
