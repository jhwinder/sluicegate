services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - POLICY_PATH=/policies/policy.yml
      - BASE_URL=http://localhost:8000
      - UI_URL=http://localhost:8080
      - RESEND_API_KEY={YOURKEY}
      - APPROVER_EMAIL=approver@domain.com
      - RESEND_FROM=onboarding@resend.dev
    volumes:
      - ./policies:/policies:ro

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
